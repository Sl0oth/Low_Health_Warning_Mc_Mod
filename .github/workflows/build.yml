name: build and client audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALSOFT_DRIVERS: 'null'
      LIBGL_ALWAYS_SOFTWARE: 'true'
    strategy:
      fail-fast: false
      matrix:
        group: ['1.20-1.20.6', '1.21-1.21.5', '1.21.6-1.21.8', '1.21.9-1.21.11', '26.1-26.2']
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display for client tests
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils mesa-utils libgl1-mesa-dri libopenal1
      - name: Build once and test each compatible version
        run: python3 scripts/build_release.py --group '${{ matrix.group }}'
      - name: Collect verified release candidates
        uses: actions/upload-artifact@v4
        with:
          name: low-health-warning-${{ matrix.group }}
          if-no-files-found: error
          path: |
            build/releases/*/*.jar
            build/releases/*/*.json
      - name: Collect diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.group }}
          path: build/audit/*.log
  forge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALSOFT_DRIVERS: 'null'
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display for client tests
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils mesa-utils libgl1-mesa-dri libopenal1
      - name: Check virtual display and OpenGL
        run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' sh -c 'xrandr --query && glxinfo -B'
      - name: Build and audit packaged Forge client
        run: JAVA21_HOME="$JAVA_HOME_21_X64" JAVA8_HOME="$JAVA_HOME_8_X64" xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' python3 scripts/audit_forge.py
      - name: Collect verified Forge candidate
        uses: actions/upload-artifact@v4
        with:
          name: low-health-warning-forge-1.8.9
          if-no-files-found: error
          path: |
            build/releases/*/*forge*.jar
            build/releases/*/*forge*.json
      - name: Collect diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-forge-1.8.9
          path: |
            build/audit/*.log
            forge-1.8.9/build/audit-launch.json
