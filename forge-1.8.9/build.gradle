plugins {
    id 'java'
    id 'gg.essential.loom' version '0.10.0.5'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
}
version = '1.2.1-rc.1'
group = 'slooth.lowhealth'
base { archivesName = 'lowhelthwarning-1.8.9-forge' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'
}
loom { forge { pack200Provider.set(new dev.architectury.pack200.java.Pack200Adapter()) } }
java { toolchain.languageVersion = JavaLanguageVersion.of(8) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// The test mod is separate from the user artifact.
sourceSets {
    audit {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('auditJar', Jar) {
    from sourceSets.audit.output
    archiveFileName = 'lowhealth-forge-audit-dev.jar'
    destinationDirectory = layout.buildDirectory.dir('testlibs')
}
tasks.register('remapAuditJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('auditJar')
    classpath(sourceSets.audit.compileClasspath)
    inputs.files(sourceSets.audit.compileClasspath)
    outputs.upToDateWhen { false }
    input.set(tasks.named('auditJar').flatMap { it.archiveFile })
    archiveFileName = 'lowhealth-forge-audit.jar'
    destinationDirectory = layout.buildDirectory.dir('testlibs')
}
tasks.register('writeAuditLaunch') {
    dependsOn tasks.named('remapJar'), tasks.named('remapAuditJar'), tasks.named('downloadAssets')
    doLast {
        def cache = new File(gradle.gradleUserHomeDir, 'caches/essential-loom')
        def libs = sourceSets.main.runtimeClasspath.files.findAll {
            it.isFile() && !it.path.contains('/essential-loom/') && !it.name.contains('dev-launch-injector') && !it.name.contains('architectury-transformer')
        }
        libs += new File(cache, '1.8.9/minecraft-client.jar')
        libs += new File(cache, '1.8.9/forge/1.8.9-11.15.1.2318-1.8.9/forge-universal.jar')
        def launch = [classpath:libs.collect {it.absolutePath}, natives:new File(cache,'1.8.9/natives').absolutePath,
            assets:new File(cache,'assets').absolutePath, assetIndex:'1.8.9-1.8',
            candidate:tasks.remapJar.archiveFile.get().asFile.absolutePath,
            fixture:tasks.remapAuditJar.archiveFile.get().asFile.absolutePath]
        file('build/audit-launch.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launch))
    }
}
